<section class="orders-page">
  <div class="container">

    <div class="page-header">
      <h1>My Orders</h1>
      <p>Track and manage your previous purchases.</p>
    </div>

    <div class="orders-list">

      @for(order of userOrders;track order.orderId){
        <app-order [order]="order"/>
      }

    </div>

  </div>
</section>
