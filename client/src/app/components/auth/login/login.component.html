<section class="login-page">
  <div class="container">
    <div class="login-card">
      <div class="login-header">
        <h1>Welcome Back</h1>

        <p>Sign in to continue shopping on Silk Road</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- EMAIL -->

        <div class="mb-4">
          <label class="form-label"> Email Address </label>

          <input
            type="email"
            class="form-control custom-input"
            [class.required]="
              !loginForm.controls.email.valid &&
              loginForm.controls.email.touched
            "
            formControlName="email"
            placeholder="john@example.com"
          />
        </div>

        <!-- PASSWORD -->

        <div class="col-12">
          <label class="form-label">Password *</label>

          <!-- Container prevents icon from breaking standard Bootstrap layouts -->
          <div class="position-relative">
            <input
              [type]="hidePassword ? 'password' : 'text'"
              class="form-control custom-input pe-5"
              [class.required]="
                !loginForm.controls.password.valid &&
                loginForm.controls.password.touched
              "
              formControlName="password"
              placeholder="Enter Password"
            />
            <!-- Toggle Button -->
            <button
              type="button"
              (click)="hidePassword = !hidePassword"
              class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-secondary py-0"
              style="z-index: 10; padding-right: 0.75rem"
            >
              @if (hidePassword) {
                <!-- Eye Icon -->
                <svg
                  xmlns="http://w3.org"
                  width="18"
                  height="18"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              } @else {
                <!-- Eye Slash Icon -->
                <svg
                  xmlns="http://w3.org"
                  width="18"
                  height="18"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 014.132-5.4M9.69 9.69a3 3 0 004.243 4.243m1.804-1.804L21 21M3 3l3.59 3.59m0 0A9.917 9.917 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.4M12 7a5 5 0 01-5 5"
                  />
                </svg>
              }
            </button>
          </div>
        </div>
        <!-- REMEMBER -->

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" />

            <label class="form-check-label" for="rememberMe">
              Remember Me
            </label>
          </div>

          <a routerLink="/forgot-password" class="forgot-link">
            Forgot Password?
          </a>
        </div>

        <!-- SUBMIT -->

        <button
          type="submit"
          class="btn login-btn"
          [disabled]="loginForm.invalid"
        >
          Sign In
        </button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- SOCIAL -->

      <div class="social-buttons">
        <button class="btn social-btn">
          <i class="fa fa-google"></i>
          Google
        </button>
      </div>

      <div class="register-link">
        Don't have an account?

        <a routerLink="/register"> Create Account </a>
      </div>
    </div>
  </div>
</section>
