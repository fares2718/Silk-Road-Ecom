<section class="register-page">
  <div class="container">
    <div class="register-card">
      <div class="register-header">
        <h1>Create Account</h1>

        <p>Join Silk Road and start shopping today.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <!-- FIRST NAME -->
          <div class="col-md-4">
            <label class="form-label">First Name *</label>

            <input
              type="text"
              class="form-control custom-input"
              [class.required]="
                !registerForm.controls.firstName.valid &&
                registerForm.controls.firstName.touched
              "
              formControlName="firstName"
              placeholder="John"
            />
          </div>

          <!-- MIDDLE NAME -->
          <div class="col-md-4">
            <label class="form-label">Middle Name</label>

            <input
              type="text"
              class="form-control custom-input"
              formControlName="middleName"
              placeholder="Michael"
            />
          </div>

          <!-- LAST NAME -->
          <div class="col-md-4">
            <label class="form-label">Last Name *</label>

            <input
              type="text"
              class="form-control custom-input"
              [class.required]="
                !registerForm.controls.lastName.valid &&
                registerForm.controls.lastName.touched
              "
              formControlName="lastName"
              placeholder="Doe"
            />
          </div>

          <!-- DISPLAY NAME -->
          <div class="col-md-6">
            <label class="form-label">Display Name *</label>

            <input
              type="text"
              class="form-control custom-input"
              [class.required]="
                !registerForm.controls.displayName.valid &&
                registerForm.controls.displayName.touched
              "
              formControlName="displayName"
              placeholder="John Doe"
            />
          </div>

          <!-- USERNAME -->
          <div class="col-md-6">
            <label class="form-label">Username *</label>

            <input
              type="text"
              class="form-control custom-input"
              [class.required]="
                !registerForm.controls.username.valid &&
                registerForm.controls.username.touched
              "
              formControlName="username"
              placeholder="john_doe"
            />
          </div>

          <!-- EMAIL -->
          <div class="col-12">
            <label class="form-label">Email Address *</label>

            <input
              type="email"
              class="form-control custom-input"
              [class.required]="
                !registerForm.controls.email.valid &&
                registerForm.controls.email.touched
              "
              formControlName="email"
              placeholder="john@example.com"
            />
          </div>

          <!-- PASSWORD -->
            <div class="col-12">
              <label class="form-label">Password *</label>

              <!-- Container prevents icon from breaking standard Bootstrap layouts -->
              <div class="position-relative">
                <input
                  [type]="hidePassword ? 'password' : 'text'"
                  class="form-control custom-input pe-5"
                  [class.required]="
                    (!registerForm.controls.password.valid &&
                      registerForm.controls.password.touched) ||
                    (!passwordMatchValidator &&
                      registerForm.controls.confirmPassword.touched)
                  "
                  formControlName="password"
                  placeholder="Enter Password"
                />
                <!-- Toggle Button -->
                <button
                  type="button"
                  (click)="hidePassword = !hidePassword"
                  class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-secondary py-0"
                  style="z-index: 10; padding-right: 0.75rem"
                >
                  @if (hidePassword) {
                    <!-- Eye Icon -->
                    <svg
                      xmlns="http://w3.org"
                      width="18"
                      height="18"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  } @else {
                    <!-- Eye Slash Icon -->
                    <svg
                      xmlns="http://w3.org"
                      width="18"
                      height="18"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 014.132-5.4M9.69 9.69a3 3 0 004.243 4.243m1.804-1.804L21 21M3 3l3.59 3.59m0 0A9.917 9.917 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.4M12 7a5 5 0 01-5 5"
                      />
                    </svg>
                  }
                </button>
              </div>

              <label class="form-label mt-2">Confirm Password</label>

              <div class="position-relative">
                <input
                  [type]="hideConfirmPassword ? 'password' : 'text'"
                  class="form-control custom-input pe-5"
                  [class.required]="
                    (!registerForm.controls.confirmPassword.valid &&
                      registerForm.controls.confirmPassword.touched) ||
                    (!passwordMatchValidator &&
                      registerForm.controls.confirmPassword.touched)
                  "
                  formControlName="confirmPassword"
                  placeholder="Confirm Entered Password"
                />
                <!-- Toggle Button -->
                <button
                  type="button"
                  (click)="hideConfirmPassword = !hideConfirmPassword"
                  class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-secondary py-0"
                  style="z-index: 10; padding-right: 0.75rem"
                >
                  @if (hideConfirmPassword) {
                    <!-- Eye Icon -->
                    <svg
                      xmlns="http://w3.org"
                      width="18"
                      height="18"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  } @else {
                    <!-- Eye Slash Icon -->
                    <svg
                      xmlns="http://w3.org"
                      width="18"
                      height="18"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.025 10.025 0 014.132-5.4M9.69 9.69a3 3 0 004.243 4.243m1.804-1.804L21 21M3 3l3.59 3.59m0 0A9.917 9.917 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.4M12 7a5 5 0 01-5 5"
                      />
                    </svg>
                  }
                </button>
              </div>
            </div>

            @if (!passwordMatchValidator) {
              <p class="text-danger mt-1">password doesn't match</p>
            }
          </div>

        <button
          type="submit"
          class="btn register-btn mt-4"
          [disabled]="registerForm.invalid"
        >
          Create Account
        </button>
      </form>

      <div class="login-link">
        Already have an account?

        <a routerLink="/login"> Login </a>
      </div>
    </div>
  </div>
</section>
