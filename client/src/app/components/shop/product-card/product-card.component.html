<article class="product-card">
  <!-- PRODUCT IMAGE -->
  <div class="product-media">
    <a href="#" class="main-image-container">
      <img
        src="/assets/logo.ico"
        alt="Nike Air Max Running Shoes"
        class="main-image"
      />

      <span class="category-badge"> Shoes </span>
    </a>

    <!-- THUMBNAILS -->
    <div class="thumbnail-container">
      <img
        src="/assets/logo.ico"
        alt="Product thumbnail"
        class="thumbnail-image active-thumb"
      />

      <img
        src="/assets/logo.ico"
        alt="Product thumbnail"
        class="thumbnail-image"
      />

      <img
        src="/assets/logo.ico"
        alt="Product thumbnail"
        class="thumbnail-image"
      />
    </div>
  </div>

  <!-- PRODUCT INFO -->
  <div class="product-content">
    <!-- CATEGORY -->
    <span class="product-category"> Running Collection </span>

    <!-- TITLE -->
    <h2 class="product-title">Nike Air Max 270</h2>

    <!-- DESCRIPTION -->
    <p class="product-description">
      Premium lightweight running shoes designed for comfort, flexibility, and
      everyday street fashion.
    </p>

    <!-- PRICE -->
    <div class="price-container">
      <span class="new-price"> $120 </span>

      <span class="old-price"> $160 </span>

      <span class="discount-badge"> -25% </span>
    </div>

    <!-- RATING -->
    <div class="rating">
      <i class="fa fa-star"></i>
      <i class="fa fa-star"></i>
      <i class="fa fa-star"></i>
      <i class="fa fa-star"></i>
      <i class="fa fa-star-half-o"></i>

      <span class="rating-text"> (4.5) </span>
    </div>

    <!-- ACTIONS -->
    <div class="product-actions">
      <button class="btn custom-btn-outline favorite-btn">
        <i class="fa fa-bookmark"></i>
      </button>

      <button class="btn add-cart-btn">
        <i class="fa fa-shopping-cart"></i>

        <span> Add To Basket </span>
      </button>

      <button class="btn details-btn">
        <i class="fa fa-info-circle"></i>
      </button>
    </div>
  </div>
</article>
