<section class="basket-page">
  <div class="container">
    <h1 class="page-title">Shopping Basket</h1>

    <div class="row g-4">
      <!-- BASKET ITEMS -->
      <div class="col-lg-8">
        <!-- ITEM -->
        @for (item of basket.basketItems; track basket.basketID) {
          <div class="basket-item">
            <img
              [src]="'https://localhost:7041' + item.imageURL"
              alt="Product"
              class="product-image"
            />

            <div class="product-info">
              <span class="category"> {{item.category}} </span>

              <h4 class="product-name">{{item.itemName}}</h4>

              <div class="price">{{item.price|currency}}</div>
            </div>

            <!-- QUANTITY -->
            <div class="quantity-box">
              <button>-</button>

              <span>{{item.quantity}}</span>

              <button>+</button>
            </div>

            <!-- TOTAL -->
            <div class="item-total">{{item.quantity*item.price|currency}}</div>

            <button (click)="deleteItem(item.itemID)" class="remove-btn">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        }
      </div>

      <!-- ORDER SUMMARY -->
      <div class="col-lg-4">
        <div class="summary-card">
          <h3>Order Summary</h3>

          <div class="summary-row">
            <span> Subtotal </span>

            <span> {{totalAmount|currency}} </span>
          </div>

          <div class="summary-row">
            <span> Shipping </span>

            <span> Free </span>
          </div>

          <div class="summary-row">
            <span> Tax </span>

            <span> $25 </span>
          </div>

          <hr />

          <div class="summary-row total-row">
            <span> Total </span>

            <span> {{totalAmount + 25}} </span>
          </div>

          <button class="checkout-btn">Proceed To Checkout</button>
        </div>
      </div>
    </div>
  </div>
</section>
